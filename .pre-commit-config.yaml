minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^mkdocs\.yml$'
      - id: check-yaml
        name: check MkDocs YAML syntax
        args: [--unsafe]
        files: '^mkdocs\.yml$'
      - id: end-of-file-fixer
        exclude: '\.(?:otf|ttf|pdf|png|jpe?g|gif|webp|bmp)$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(?:otf|ttf|pdf|png|jpe?g|gif|webp|bmp)$'
      - id: trailing-whitespace
        exclude: '\.(?:otf|ttf|pdf|png|jpe?g|gif|webp|bmp)$'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: course-tool-tests
        name: test course tools with coverage
        entry: python latex/tools/run_tool_tests.py
        language: python
        additional_dependencies: [coverage==7.15.3]
        pass_filenames: false
        files: '(^latex/tools/.*\.py$|^\.pre-commit-config\.yaml$)'
      - id: python-lint
        name: lint Python tools
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.16.1]
        types: [python]
      - id: python-types
        name: type-check Python tools
        entry: mypy latex/tools
        language: python
        additional_dependencies: [coverage==7.15.3, mypy==2.3.0]
        pass_filenames: false
        files: '(^latex/tools/.*\.py$|^mypy\.ini$|^\.pre-commit-config\.yaml$)'
      - id: documentation-site
        name: build documentation and check rendered links
        entry: python latex/tools/build_docs.py
        language: python
        additional_dependencies: [mkdocs==1.6.1, mkdocs-material==9.7.7]
        pass_filenames: false
        files: '(\.md$|^docs/|^mkdocs\.yml$|^latex/tools/.*\.py$|^\.github/requirements-docs\.txt$|^\.pre-commit-config\.yaml$)'
      - id: latex-repository-check
        name: validate LaTeX repository and Markdown links
        entry: python latex/tools/check_repository.py
        language: python
        pass_filenames: false
        files: '(^[123]/|^latex/|^docs/|\.md$|^\.github/workflows/|^\.pre-commit-config\.yaml$)'
