services:
  texlive:
    image: ghcr.io/xu-cheng/texlive-alpine:latest@sha256:c06416ebbc69c8e90e07d1f1a6f7a3f9b334e773daa3543ce879ea533317c3a7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: []
    init: true
    network_mode: none
    environment:
      HOME: /tmp
      TEXMFVAR: /tmp/texmf-var
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
