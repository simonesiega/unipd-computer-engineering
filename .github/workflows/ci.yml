name: Change validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: >
          python -m pip install
          --disable-pip-version-check
          -r .github/requirements-ci.txt

      - name: Run all checks
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: Compile affected documents
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Collect changed files
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=ACMRD "$BASE" HEAD -- \
              > .build/changed-files.txt
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull canonical TeX Live image
        run: docker compose pull texlive

      - name: Build affected documents
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.mode }}" = "all" ]; then
            docker compose run --rm --no-deps texlive \
              python3 latex/tools/build.py --all --keep-going --check-generated
          else
            docker compose run --rm --no-deps texlive \
              python3 latex/tools/build.py \
                --changed-file-list .build/changed-files.txt \
                --keep-going \
                --check-generated
          fi

      - name: Upload LaTeX logs after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latex-logs-${{ github.sha }}
          path: |
            .build/**/*.log
            .build/**/*.blg
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Upload compiled PDFs for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latex-pdfs-${{ github.sha }}
          path: .build/**/main.pdf
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
