name: Publish compiled notes

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Publication type
        required: true
        default: rolling
        type: choice
        options:
          - rolling
          - snapshot
      release_tag:
        description: Snapshot tag (required for snapshots, for example 2026-2027-semester-1)
        required: false
        type: string
      release_title:
        description: Snapshot title (required for snapshots)
        required: false
        type: string
      release_description_file:
        description: Optional repository-relative Markdown description file
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notes-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate publication request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_KIND" = "rolling" ]; then
            LATEST_MAIN="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
            if [ "$LATEST_MAIN" != "$GITHUB_SHA" ]; then
              echo "Rolling publication must be dispatched from the latest main commit." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Snapshot tags must use letters, digits, dots, underscores, or hyphens." >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" = "notes-latest" ]; then
            echo "notes-latest is reserved for the rolling release." >&2
            exit 1
          fi
          if [ -z "${RELEASE_TITLE//[[:space:]]/}" ]; then
            echo "Snapshot release title must not be empty." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Snapshot release already exists and will not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Snapshot tag already exists and will not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: >
          python -m pip install
          --disable-pip-version-check
          -r .github/requirements-ci.txt

      - name: Run all checks
        run: pre-commit run --all-files --show-diff-on-failure

  package:
    name: Compile and package complete archive
    needs: [preflight, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Prepare release description
        shell: bash
        env:
          RELEASE_DESCRIPTION_FILE: ${{ inputs.release_description_file || '' }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          filename = os.environ["RELEASE_DESCRIPTION_FILE"].strip()
          description = ""
          if filename:
              requested = Path(filename)
              if requested.is_absolute():
                  raise SystemExit(
                      "The release description file path must be repository-relative."
                  )
              candidate = (root / requested).resolve()
              try:
                  candidate.relative_to(root)
              except ValueError as error:
                  raise SystemExit(
                      "The release description file must remain inside the repository."
                  ) from error
              if not candidate.is_file():
                  raise SystemExit(
                      f"Release description file does not exist: {filename}"
                  )
              description = candidate.read_text(encoding="utf-8")
          (root / ".build/release-description.md").write_text(
              description, encoding="utf-8", newline="\n"
          )
          PY

      - name: Pull canonical TeX Live image
        run: docker compose pull texlive

      - name: Build every document
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps texlive \
            python3 latex/tools/build.py --all --keep-going --check-generated

      - name: Upload LaTeX logs after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-latex-logs-${{ github.sha }}
          path: |
            .build/**/*.log
            .build/**/*.blg
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Package release assets
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.release_kind == 'rolling' && 'Latest compiled notes' || inputs.release_title }}
        run: |
          set -euo pipefail
          RELEASE_TIMESTAMP="$(git show -s --format=%cI "$GITHUB_SHA")"
          docker compose run --rm --no-deps texlive \
            python3 latex/tools/package_notes.py \
              --source-commit "$GITHUB_SHA" \
              --release-timestamp "$RELEASE_TIMESTAMP" \
              --release-title "$RELEASE_TITLE" \
              --description-file .build/release-description.md

      - name: Validate packaged release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .build/release/manifest.json >/dev/null
          test -s .build/release/RELEASE_NOTES.md
          (cd .build/release && sha256sum --check SHA256SUMS.txt)
          find .build/release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort

      - name: Transfer release package to publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notes-release-${{ github.sha }}
          path: .build/release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out publication source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Download validated release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: notes-release-${{ github.sha }}
          path: .build/release

      - name: Publish rolling release or immutable snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          SNAPSHOT_TAG: ${{ inputs.release_tag || '' }}
          SNAPSHOT_TITLE: ${{ inputs.release_title || '' }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_KIND" = "rolling" ]; then
            TAG="notes-latest"
            TITLE="Latest compiled notes"
            MAKE_LATEST="true"
          else
            TAG="$SNAPSHOT_TAG"
            TITLE="$SNAPSHOT_TITLE"
            MAKE_LATEST="false"
            if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1 \
              || gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "Snapshot tag or release already exists; refusing to overwrite: $TAG" >&2
              exit 1
            fi
          fi

          NOTES_FILE=".build/release/RELEASE_NOTES.md"
          if [ "$RELEASE_KIND" = "rolling" ] \
            && gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .id)"
            gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
              -F draft=true \
              -f body="Publication in progress for $GITHUB_SHA."
          else
            RELEASE_ID="$(
              gh api --method POST "repos/$REPOSITORY/releases" \
                -f tag_name="$TAG" \
                -f target_commitish="$GITHUB_SHA" \
                -f name="$TITLE" \
                -f body="Publication in progress for $GITHUB_SHA." \
                -F draft=true \
                -F prerelease=false \
                --jq .id
            )"
          fi

          declare -A expected_assets=()
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            expected_assets["$name"]=1
            gh release upload "$TAG" "$asset" --clobber --repo "$REPOSITORY"
          done < <(find .build/release -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)

          if [ "$RELEASE_KIND" = "rolling" ]; then
            while IFS=$'\t' read -r asset_id asset_name; do
              if [ -z "${expected_assets[$asset_name]+present}" ]; then
                echo "Deleting stale rolling-release asset: $asset_name"
                gh api --method DELETE \
                  "repos/$REPOSITORY/releases/assets/$asset_id"
              fi
            done < <(
              gh api --paginate "repos/$REPOSITORY/releases/$RELEASE_ID/assets" \
                --jq '.[] | [.id, .name] | @tsv'
            )

            if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/$TAG" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api --method POST "repos/$REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            fi
          fi

          gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest="$MAKE_LATEST" \
            -f name="$TITLE" \
            -f body="$(cat "$NOTES_FILE")" >/dev/null

          echo "Published $TAG from $GITHUB_SHA with ${#expected_assets[@]} assets."

      - name: Update README release catalogue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p .build
          gh api --paginate --slurp \
            "repos/$REPOSITORY/releases?per_page=100" \
            > .build/releases.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --no-tags origin \
              "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            python3 latex/tools/update_release_catalog.py \
              --releases-json .build/releases.json

            if git diff --quiet -- README.md; then
              echo "README release catalogue is already current."
              exit 0
            fi

            git add -- README.md
            git commit -m "docs(releases): update published notes catalogue [skip ci]"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              CATALOG_SHA="$(git rev-parse HEAD)"
              if gh api "repos/$REPOSITORY/git/ref/tags/notes-latest" \
                >/dev/null 2>&1; then
                gh api --method PATCH \
                  "repos/$REPOSITORY/git/refs/tags/notes-latest" \
                  -f sha="$CATALOG_SHA" -F force=true >/dev/null
              fi
              echo "Published README release catalogue at $CATALOG_SHA."
              exit 0
            fi
            echo "The branch advanced; retrying catalogue update ($attempt/3)."
          done

          echo "Could not update the README release catalogue after three attempts." >&2
          exit 1
