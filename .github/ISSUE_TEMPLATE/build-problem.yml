name: Build problem
description: Report a reproducible failure in the build tools, validation checks, or CI.
title: "[Build problem]: "
body:
  - type: markdown
    attributes:
      value: |
        Include enough detail to reproduce the failure. For security vulnerabilities, use private vulnerability reporting instead of this public form.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Local LaTeX build
        - Repository validation
        - Generated files
        - GitHub Actions / CI
        - Release packaging or publishing
        - Installation or dependencies
        - Other
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Build target or workflow
      description: Name the course path, component example, command, or workflow job that fails.
      placeholder: e.g. 1/course-name or Publish compiled notes / Package release assets
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Docker and Compose versions, canonical image digest, or native Python and TeX versions when relevant.
      placeholder: |
        OS: Windows 11
        Docker: 29.4.2
        Docker Compose: 5.1.3
        Build mode: canonical Docker environment
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact commands and smallest sequence that consistently causes the problem.
      placeholder: |
        1. Check out ...
        2. Run `docker compose run --rm texlive python3 latex/tools/build.py ...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output or logs
      description: Paste the relevant complete error. Remove credentials, tokens, personal paths, and other sensitive data.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links to failing CI runs, the first affected commit, or attempted fixes.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I followed the installation and building guides and searched for duplicate issues.
          required: true
        - label: I removed secrets, private data, and sensitive paths from the report.
          required: true
